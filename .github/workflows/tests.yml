name: tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    uses: GNS-Science/nshm-github-actions/.github/workflows/python-run-tests-uv.yml@main
    with:
      operating-systems: "['ubuntu-latest']"
      python-versions: "['3.12', '3.13', '3.14']"
      # pinned uv older than a week (supply-chain cooldown); dependencies come from uv.lock
      uv-version: "0.11.6"
      # set to true once CODECOV_TOKEN is configured
      fail-on-codecov-error: false
    secrets: inherit
