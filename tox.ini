[tox]
envlist = py312, py313, py314

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
# tox-uv: install from uv.lock (--locked), so the 1-week cutoff and pinned versions apply
runner = uv-venv-lock-runner
dependency_groups = dev
commands = pytest --cov=model_checks --cov-report=xml:{toxinidir}/coverage.xml --cov-report=term {posargs}
